// 根 build.gradle

def hermesPath = file("${rootDir}/../../node_modules/react-native/sdks/hermes-engine")
if (!hermesPath.exists()) {
    hermesPath = file("${rootDir}/../node_modules/react-native/sdks/hermes-engine")
}
if (!hermesPath.exists()) {
    throw new Exception("Hermes SDK not found at: " + hermesPath)
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://a.amap.com/repo/' }  // 高德官方仓库
    }
}

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://a.amap.com/repo/' }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("com.facebook.react:react-native-gradle-plugin:0.75.3") // 根据 RN 版本修改
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22")
    }
}

apply plugin: "com.facebook.react.rootproject"
